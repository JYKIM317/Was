version: '3.8'

services:
  db:
    image: p2-was-db
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2-was-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: "db1004"
      MYSQL_USER: "zizone"
      MYSQL_PASSWORD: "ganzi"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql